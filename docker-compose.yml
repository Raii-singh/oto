version: '3.9'

networks:
  oto-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  # ─── Databases ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: oto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: otowire
      POSTGRES_USER: oto
      POSTGRES_PASSWORD: otopassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - oto-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oto -d otowire"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oto-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - oto-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── Microservices ───────────────────────────────────────────────────────
  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    container_name: oto-content
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      CONTENT_API_PROVIDER: omdb
      OMDB_API_KEY: ${OMDB_API_KEY:-bec831df}
      OMDB_BASE_URL: http://www.omdbapi.com
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_BASE_URL: https://api.themoviedb.org/3
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - oto-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: oto-auth
    restart: unless-stopped
    environment:
      PORT: 3002
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-oto_super_secret_jwt_key_change_in_production}
      JWT_EXPIRES_IN: 7d
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: otowire
      DB_USER: oto
      DB_PASSWORD: otopassword
      BCRYPT_ROUNDS: 10
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oto-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  watchlist-service:
    build:
      context: ./services/watchlist-service
      dockerfile: Dockerfile
    container_name: oto-watchlist
    restart: unless-stopped
    environment:
      PORT: 3003
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-oto_super_secret_jwt_key_change_in_production}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: otowire
      DB_USER: oto
      DB_PASSWORD: otopassword
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oto-net

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oto-frontend
    restart: unless-stopped
    environment:
      CONTENT_SERVICE_URL: http://content-service:3001
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3002
      NEXT_PUBLIC_SITE_URL: http://localhost
    ports:
      - "3000:3000"
    depends_on:
      - content-service
    networks:
      - oto-net

  # ─── NGINX Gateway ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: oto-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - content-service
      - auth-service
      - watchlist-service
    networks:
      - oto-net

  # ─── Monitoring ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: oto-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - oto-net

  grafana:
    image: grafana/grafana:latest
    container_name: oto-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: oto_grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    networks:
      - oto-net
