events { worker_connections 1024; }

http {
  upstream frontend    { server frontend:3000; }
  upstream content     { server content-service:3001; }
  upstream auth        { server auth-service:3002; }
  upstream watchlist   { server watchlist-service:3003; }

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  server {
    listen 80;
    server_name _;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Frontend
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Content Service API
    location /api/content/ {
      limit_req zone=api burst=20 nodelay;
      rewrite ^/api/content/(.*) /content/$1 break;
      proxy_pass http://content;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Auth Service API
    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      rewrite ^/api/auth/(.*) /auth/$1 break;
      proxy_pass http://auth;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Watchlist Service API
    location /api/watchlist/ {
      limit_req zone=api burst=10 nodelay;
      rewrite ^/api/watchlist/(.*) /watchlist/$1 break;
      proxy_pass http://watchlist;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check aggregation
    location /health {
      default_type application/json;
      return 200 '{"status":"ok","gateway":"nginx"}';
    }
  }
}
